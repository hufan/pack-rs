# 打包配置文件

# 输出目录
output_dir = "./output"

# 并发控制
max_concurrent = 4

# 全局配置
max_retries = 3
fetch_timeout = 1800
package_timeout = 600

# 场景 1：只下载，不打包
[[repositories]]
name = "myir-ti-uboot"
url = "https://github.com/MYIR-TI/myir-ti-uboot.git"
branch = "develop-ti-u-boot-2025.01-V11.00.15.02"
target_dir = "repos/myir-ti-uboot"
clean_before_pull = true
depth = 1
include_git = true
enable_fetch = true
enable_package = false

# 场景 2：只打包，不下载（本地已有）
[[repositories]]
name = "myir-ti-linux"
url = "https://github.com/MYIR-TI/myir-ti-linux.git"
branch = "develop-ti-linux-6.12.y-V11.00.15.05"
target_dir = "repos/myir-ti-linux-existing"
enable_fetch = false
enable_package = true
include_git = true

# 场景 3：下载 + 打包（默认行为）
[[repositories]]
name = "atf"
url = "https://github.com/MYIR-TI/myir-ti-atf.git"
branch = "develop-ti-master-V11.00.15.02"
