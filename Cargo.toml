[package]
name = "pack-rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tar = "0.4"
flate2 = "1.0"
anyhow = "1.0"
chrono = { version = "0.4" }
serde_json = "1.0"
tokio = { version = "1.35", features = ["macros", "fs", "process", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
async-trait = "0.1"